name: Deploy

# Runs only after CI succeeds, rather than in parallel with it.
#
# The previous version triggered on `push` and deployed the web service only,
# with no test gate and no migration step. Two consequences: a commit that broke
# type-check, lint or the tenant-isolation suite could still reach production,
# and schema changes never reached the database at all.
#
# Using `workflow_run` gives a real ordering guarantee: quality and migration
# validation both pass before anything ships.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Never cancel an in-flight deploy: a half-applied migration is worse than a
  # queued one.
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Schema first. Application code is normally written against the new schema,
  # so migrations must land before the new revision starts serving traffic.
  # ---------------------------------------------------------------------------
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify DATABASE_URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set. Add it under repository secrets."
            exit 1
          fi

      # Idempotent by design, and guarded by an advisory lock so two concurrent
      # deploys cannot apply the same migration twice (§216, §217).
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  deploy-web:
    name: Deploy Command Center
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Add it under repository secrets."
            exit 1
          fi
          railway up --service "${RAILWAY_WEB_SERVICE:-web}" --detach

  deploy-relay:
    name: Deploy relay
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Add it under repository secrets."
            exit 1
          fi
          cd apps/relay
          railway up --service "${RAILWAY_RELAY_SERVICE:-relay}" --detach
